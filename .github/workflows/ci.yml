name: Secretless CI

on:
  pull_request:
  push:
    branches:
      - v2-cms
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: secretless-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static and unit contracts
        run: |
          npm run test:supabase-stabilization-migrations
          npm run test:showroom-schema-bootstrap
          npm run test:colorbook-schema-bootstrap
          npm run test:postgrest-migration-chain-contract
          npm run test:showroom-preview-payload
          npm run test:showroom-rls-hardening
          npm run test:showroom-image-derivatives
          npm run test:showroom-image-policy-contract
          npm run test:showroom-descendant-gallery
          npm run test:production-fixture-boundary
          npm run test:server-actions-origin
          npm run test:content-asset-hidden-draft-references
          npm run test:safe-internal-path
          npm run test:measure-experience
          npm run test:official-asset-detach
          npm run test:admin-node-list-primitives
          npm run test:admin-site-settings-primitives
          npm run test:admin-node-form-persistence
          npm run test:official-brand-asset-import
          npm run test:official-brand-asset-placement
          npm run test:official-media-evidence-docs
          npm run test:source-provenance-automation
          npm run test:brand-token-snapshot
          npm run test:ui-token-policy
          npm run verify:brand-tokens
          npm run verify:ui-token-policy
          npm run verify:blog-admin-cms
          npm run verify:blog-public-safety
          npm run verify:blog-body-blocks
          npm run verify:blog-claim-safety
      - name: Type generation
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Authenticated Playwright and live Supabase checks remain local/Preview
      # gates so this workflow never requires repository secrets.

  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start isolated local PostgreSQL 17 with PostgREST
        run: >
          npx --yes --package supabase@2.109.1 supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          --ignore-health-check
      - name: Apply every tracked migration to an empty database
        run: npx --yes --package supabase@2.109.1 supabase db reset --local --no-seed
      - name: Assert the 18 typed showroom tables exist after the migration chain
        run: >
          npx --yes --package supabase@2.109.1 supabase db query --local
          --file supabase/tests/verify-showroom-table-count.sql

      - name: List showroom tables after the migration chain
        run: >
          npx --yes --package supabase@2.109.1 supabase db query --local
          --file supabase/tests/list-showroom-tables.sql

      - name: Verify PostgREST schema cache and REST
        run: |
          node scripts/verify-postgrest-migration-chain.mjs
          container="$(docker ps --filter 'name=^/supabase_rest_' --format '{{.Names}}' | head -n 1)"
          if [ -z "$container" ]; then
            echo "::error::PostgREST container not found"
            exit 1
          fi
          if ! docker logs --tail 250 "$container" 2>&1 | grep -q "Schema cache loaded"; then
            echo "::error::PostgREST did not report a successful schema cache load"
            docker logs --tail 250 "$container"
            exit 1
          fi

      - name: Show PostgREST logs
        if: always()
        run: |
          container="$(docker ps --filter 'name=^/supabase_rest_' --format '{{.Names}}' | head -n 1)"
          if [ -z "$container" ]; then
            echo "::error::PostgREST container not found"
            docker ps --format '{{.Names}} {{.Status}}'
            exit 1
          fi
          docker logs --tail 250 "$container"

  measure-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure browser contract
        run: npm run test:measure-experience-browser
