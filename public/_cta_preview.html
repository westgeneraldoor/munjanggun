<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Bar 리디자인 비교</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg: #0C0C0E;
    --color-surface: #1A1A1F;
    --color-surface-elevated: #242429;
    --color-accent: #C4A265;
    --color-accent-hover: #D4B275;
    --color-accent-foreground: #0C0C0E;
    --color-text: #F5F5F7;
    --color-text-sub: #8E8E93;
    --color-text-muted: #5A5A5F;
    --color-border: #2A2A30;
  }

  body {
    font-family: 'Pretendard Variable', sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 200px;
    gap: 80px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: var(--color-text-sub);
  }

  .section {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .label {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--color-accent);
    background: rgba(196,162,101,0.1);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  /* ========================================
     현재 디자인 (AS-IS)
     ======================================== */
  .current-bar {
    position: relative;
    background-color: rgba(12, 12, 14, 0.75);
    backdrop-filter: blur(16px);
    padding: 12px;
    display: flex;
    gap: 12px;
    border-radius: 12px;
  }

  .current-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--color-accent), transparent);
    border-radius: 12px 12px 0 0;
  }

  .current-bar .icon-btn {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 18px;
  }

  .current-bar .home-btn {
    background: var(--color-accent);
    background-image: linear-gradient(to bottom, rgba(255,255,255,0.18) 0%, transparent 40%, rgba(0,0,0,0.12) 100%);
    color: var(--color-accent-foreground);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
  }

  .current-bar .share-btn {
    background: rgba(196,162,101,0.06);
    border: 1px solid var(--color-accent);
    color: var(--color-accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.15);
  }

  .current-bar .main-btn {
    flex: 1;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }

  .current-bar .primary-btn {
    background: var(--color-accent);
    background-image: linear-gradient(to bottom, rgba(255,255,255,0.18) 0%, transparent 40%, rgba(0,0,0,0.12) 100%);
    color: var(--color-accent-foreground);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
  }

  .current-bar .secondary-btn {
    background: rgba(196,162,101,0.06);
    color: var(--color-accent);
    border: 1px solid var(--color-accent);
  }

  /* ========================================
     개선안 A: 미니멀 럭셔리 독
     ======================================== */
  .new-bar-a {
    position: relative;
    background: rgba(26, 26, 31, 0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 999px;
    border: 1px solid rgba(196, 162, 101, 0.15);
    box-shadow: 
      0 8px 32px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.03) inset;
  }

  .new-bar-a .icon-btn {
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(196, 162, 101, 0.25);
    background: rgba(196, 162, 101, 0.06);
    color: var(--color-accent);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .new-bar-a .icon-btn:hover {
    background: rgba(196, 162, 101, 0.15);
    border-color: rgba(196, 162, 101, 0.4);
  }

  .new-bar-a .main-btn {
    flex: 1;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }

  .new-bar-a .primary-btn {
    background: linear-gradient(135deg, var(--color-accent) 0%, #B08E50 100%);
    color: var(--color-accent-foreground);
    box-shadow: 0 2px 12px rgba(196, 162, 101, 0.25);
  }

  .new-bar-a .primary-btn:hover {
    box-shadow: 0 4px 20px rgba(196, 162, 101, 0.35);
    transform: translateY(-1px);
  }

  .new-bar-a .secondary-btn {
    background: transparent;
    color: var(--color-accent);
    border: 1px solid rgba(196, 162, 101, 0.3);
  }

  .new-bar-a .secondary-btn:hover {
    background: rgba(196, 162, 101, 0.08);
    border-color: rgba(196, 162, 101, 0.5);
  }

  /* ========================================
     개선안 B: 세그먼트 분리형
     ======================================== */
  .new-bar-b {
    position: relative;
    background: rgba(26, 26, 31, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 
      0 8px 32px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .new-bar-b .icon-btn {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--color-text-sub);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .new-bar-b .icon-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--color-text);
  }

  .new-bar-b .divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .new-bar-b .main-btn {
    flex: 1;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .new-bar-b .primary-btn {
    background: var(--color-accent);
    color: var(--color-accent-foreground);
  }

  .new-bar-b .primary-btn:hover {
    background: var(--color-accent-hover);
  }

  .new-bar-b .secondary-btn {
    background: rgba(255,255,255,0.06);
    color: var(--color-text);
    border: none;
  }

  .new-bar-b .secondary-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  /* ========================================
     개선안 C: 울트라 미니멀 (추천)
     ======================================== */
  .new-bar-c {
    position: relative;
    background: rgba(20, 20, 24, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 
      0 4px 24px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* 골드 그로우 상단 */
  .new-bar-c::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 20%;
    right: 20%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(196,162,101,0.4), transparent);
    pointer-events: none;
  }

  .new-bar-c .icon-btn {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--color-text-sub);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .new-bar-c .icon-btn:hover {
    color: var(--color-accent);
    background: rgba(196,162,101,0.08);
  }

  .new-bar-c .main-btn {
    flex: 1;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.2px;
  }

  .new-bar-c .primary-btn {
    background: var(--color-accent);
    color: var(--color-accent-foreground);
    box-shadow: 0 2px 8px rgba(196,162,101,0.2);
  }

  .new-bar-c .primary-btn:hover {
    background: var(--color-accent-hover);
    box-shadow: 0 4px 16px rgba(196,162,101,0.3);
    transform: translateY(-1px);
  }

  .new-bar-c .secondary-btn {
    background: rgba(255,255,255,0.05);
    color: var(--color-text);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .new-bar-c .secondary-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.15);
  }

  /* ========================================
     Phone Frame
     ======================================== */
  .phone-frame {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    background: var(--color-bg);
    border-radius: 24px;
    border: 2px solid var(--color-border);
    padding: 60px 0 20px;
    position: relative;
    overflow: hidden;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .phone-frame .content-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-muted);
    font-size: 12px;
    padding: 20px;
  }

  .phone-frame .bar-wrapper {
    padding: 0 12px 12px;
  }

  /* Desktop 프레임 */
  .desktop-frame {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }

  .desktop-frame .bar-wrapper {
    max-width: 600px;
    margin: 0 auto;
  }

  /* SVG Icons (inline) */
  .icon { display: inline-block; }
</style>
</head>
